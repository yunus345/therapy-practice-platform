name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      POSTGRES_USER: seans_owner
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_DB: seans
      POSTGRES_TEST_DB: seans_test
      APP_DB_USER: seans_app
      APP_DB_PASSWORD: ci-app-password
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://seans_app:ci-app-password@localhost:5432/seans
      MIGRATION_DATABASE_URL: postgresql+asyncpg://seans_owner:ci-owner-password@localhost:5432/seans
      TEST_DATABASE_URL: postgresql+asyncpg://seans_app:ci-app-password@localhost:5432/seans_test
      CSRF_SECRET: ci-only-csrf-secret-not-used-anywhere-else
      TOTP_ENCRYPTION_KEY: ci-only-totp-key-not-used-anywhere-else
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: seans_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: seans
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U seans_owner -d seans"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Create database roles
        run: ./docker/postgres/init/01-roles-and-databases.sh
        env:
          PGHOST: localhost
          PGPASSWORD: ci-owner-password
      - name: Lint and type check
        run: make lint
      - name: Apply migrations
        run: make migrate
      - name: Test
        run: make test
